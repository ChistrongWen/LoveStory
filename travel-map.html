<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一起去过 · 我们的世界地图</title><link rel="stylesheet" href="style.css?v=album2"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="travel-map.css"></head>
<body><header><a class="brand" href="index.html#places">与你岁岁年年<span>OUR LITTLE WORLD</span></a><a href="index.html#places">← 回到手帐</a></header>
<main class="atlas"><div class="section-head"><div><div class="eyebrow">SOMEWHERE WITH YOU</div><h1>世界很大，<em>一起慢慢走。</em></h1><p>从香港出发，把一起到过的地方，留在地图上。</p></div><button id="add-place" class="primary">＋ 增加地点</button></div>
<div class="atlas-layout"><section class="map-shell" aria-label="全球平面地图"><div id="world-map"></div><button id="world-view" class="outline">查看全球</button><p id="map-status" role="status">正在加载地图…</p></section><aside><div class="eyebrow">OUR FOOTPRINTS</div><h2>一起去过 <small id="count"></small></h2><p class="hint">点击标记或地点名称，在新标签页打开地点页面。点击地图空白处可选取新地点坐标。</p><div id="place-list"></div><p id="places-storage" class="hint" role="status">正在恢复共同地图登录状态…</p><button id="refresh-places" class="outline">刷新共同地图</button><button id="share-local-places" class="outline" hidden>共享本机地点</button><div class="backup-actions"><button id="export-places" class="outline">导出地点</button><button id="import-places" class="outline">导入地点</button><input id="places-file" type="file" accept="application/json" hidden></div></aside></div></main>
<dialog id="place-editor"><form id="place-form"><button id="close-editor" class="close" type="button" aria-label="关闭">×</button><div class="eyebrow">A NEW LITTLE STOP</div><h2 id="editor-title">增加一个地点</h2><label>地点名称<input name="name" required maxlength="60" placeholder="例如：香港"></label><div class="form-row"><label>经度（东正西负）<input name="lon" type="number" min="-180" max="180" step="any" required></label><label>纬度（北正南负）<input name="lat" type="number" min="-85" max="85" step="any" required></label></div><label>地点网页链接（选填）<input name="url" maxlength="2000" placeholder="例如：hong-kong.html 或 https://…"></label><small>留空会自动打开该地点的预留页面；以后可点“编辑”更换链接。</small><p id="form-error" role="alert"></p><button class="primary" type="submit">保存地点 ♡</button></form></dialog><div id="toast" role="status"></div><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="supabase-config.js?v=fullcloud1"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script><script src="journal-store.js?v=1"></script><script src="travel-map.js?v=fullcloud1"></script><script src="shared-map.js?v=1"></script></body></html>
